name: Docker CI
on:
  workflow_dispatch:
env:
  BETA_CHANNEL: 28.04
  STABLE_CHANNEL: 26.04
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - 
      name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_TOKEN }}
    - name: Build 26.04
      run: |
        docker build . --pull --build-arg OCIE_VERSION=${{env.STABLE_CHANNEL}} --build-arg PHP_VERSION=8.5 --build-arg SQL_VERSION=5.13.3 --tag bshp/walrus:${{env.STABLE_CHANNEL}} --no-cache
    - name: Push 26.04
      run: |
        docker tag bshp/walrus:${{env.STABLE_CHANNEL}} bshp/walrus:latest
        docker push bshp/walrus:${{env.STABLE_CHANNEL}}
        docker push bshp/walrus:latest

